<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SUBJECT}} Lab Report - Writing Copy</title>
  <style>
    @page { size:A4; margin:0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    :root { --bg:#0b0e13; --panel:#151a22; --panel-2:#1c222c; --line:rgba(255,255,255,.11);
            --text:#e8edf3; --muted:#8f9aa8; --blue:#4f7df5; --green:#34d399; }
    body { background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,sans-serif; }
    .container { width:min(1150px,calc(100vw - 28px)); margin:0 auto; padding:20px 0 40px; }

    header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:14px;
             border-bottom:2px solid var(--line); padding-bottom:12px; margin-bottom:18px; }
    header h1 { font-size:1.9rem; color:#fff; letter-spacing:-.015em; }
    header .count { font-family:Consolas,monospace; color:var(--muted); font-weight:700; }

    .inputs { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
    .inputs > div { display:flex; align-items:center; gap:8px; flex:1; min-width:190px; }
    .inputs span { font:700 11px Consolas,monospace; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
    .inputs input { flex:1; padding:8px 12px; font-size:13px; border-radius:6px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); outline:none; }
    .inputs input:focus { border-color:var(--blue); }

    .tab-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:16px; }
    .tab-btn { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:7px; padding:8px 14px; font:700 13px "Segoe UI",sans-serif; cursor:pointer; }
    .tab-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .out-ctrl { display:none; align-items:center; gap:10px; margin-left:auto; }
    .out-ctrl.visible { display:flex; }
    .toggle { display:inline-flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; cursor:pointer; user-select:none; }
    .toggle input { position:absolute; opacity:0; pointer-events:none; }
    .switch { width:42px; height:23px; border-radius:999px; background:#343b49; border:1px solid var(--line); position:relative; }
    .switch::after { content:""; position:absolute; width:17px; height:17px; top:2px; left:2px; border-radius:50%; background:#fff; transition:transform .2s; }
    .toggle input:checked + .switch { background:var(--blue); }
    .toggle input:checked + .switch::after { transform:translateX(19px); }
    .btn-pdf { border:0; border-radius:7px; background:var(--green); color:#06281c; font:800 13px "Segoe UI",sans-serif; padding:9px 16px; cursor:pointer; }

    /* --- code cards (screen only: this is what you hand-copy) --- */
    .cards { display:flex; flex-direction:column; gap:11px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .card-head { display:flex; align-items:flex-start; gap:12px; padding:13px 15px; cursor:pointer; }
    .card-num { flex:0 0 auto; min-width:46px; height:32px; display:grid; place-items:center; border-radius:7px;
                border:1px solid rgba(79,125,245,.3); background:rgba(79,125,245,.1); color:#8fb0ff; font:800 13px Consolas,monospace; }
    .card-q { flex:1; font-size:13.5px; line-height:1.5; color:#dfe6ee; }
    .arrow { color:var(--muted); transition:transform .2s; }
    .card.open .arrow { transform:rotate(180deg); }
    .card-body { display:none; border-top:1px solid var(--line); padding:14px; }
    .card.open .card-body { display:flex; flex-direction:column; gap:12px; }
    .info { border-left:3px solid var(--blue); background:rgba(79,125,245,.07); border-radius:0 7px 7px 0; padding:10px 13px; }
    .info-label { font:800 10px Consolas,monospace; letter-spacing:.08em; text-transform:uppercase; color:#8fb0ff; margin-bottom:5px; }
    .info p, .info li { font-size:13px; line-height:1.55; color:#c9d3de; }
    .info ol { padding-left:18px; }
    .code-wrap { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#0d1118; }
    .code-bar { display:flex; justify-content:space-between; align-items:center; background:#161c26; padding:8px 12px; font:700 11px Consolas,monospace; color:var(--muted); }
    .btn-copy { border:0; background:none; color:var(--muted); cursor:pointer; font:700 11px Consolas,monospace; }
    .btn-copy:hover { color:#fff; }
    .code-wrap pre { padding:14px; overflow:auto; font:12.5px/1.55 Consolas,"Courier New",monospace; color:#dbe4ef; white-space:pre; }

    /* --- terminals (the only thing that gets printed) --- */
    .terminals { display:flex; flex-direction:column; gap:14px; }
    .win-terminal { border-radius:8px; overflow:hidden; font-family:"Segoe UI",Tahoma,sans-serif; }
    .win-terminal.dark { background:#0c0c0c; color:#ccc; box-shadow:0 8px 24px rgba(0,0,0,.35); }
    .win-terminal.dark .win-titlebar { background:#1f1f1f; border-bottom:1px solid #333; }
    .win-terminal.dark .win-title-text, .win-terminal.dark .win-btn { color:#999; }
    .win-terminal.dark .t-process { color:#e5c07b; }
    .win-terminal.dark .t-press { color:#666; }
    .win-terminal.light { background:#fff; color:#1e1e1e; border:1px solid #d4d4d4; }
    .win-terminal.light .win-titlebar { background:#f3f3f3; border-bottom:1px solid #e0e0e0; }
    .win-terminal.light .win-title-text, .win-terminal.light .win-btn { color:#666; }
    .win-terminal.light .t-process { color:#b5850f; }
    .win-terminal.light .t-press { color:#888; }
    .win-titlebar { display:flex; align-items:center; height:28px; user-select:none; }
    .win-title-text { flex:1; font-size:11px; padding-left:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .win-btns { display:flex; height:100%; }
    .win-btn { width:36px; height:28px; display:flex; align-items:center; justify-content:center; }
    .win-btn svg { width:9px; height:9px; }
    .t-body { padding:11px 13px; white-space:pre-wrap; overflow-wrap:break-word; font:12px/1.45 Consolas,"Courier New",monospace; }

    footer { margin-top:26px; border-top:1px solid var(--line); padding-top:12px; text-align:center; color:var(--muted); font:700 10px Consolas,monospace; letter-spacing:.06em; }
    @media print { .no-print { display:none !important; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>{{SUBJECT}} Lab Report</h1>
      <span class="count" id="progCount"></span>
    </header>

    <section class="inputs no-print">
      <div><span>Name:</span><input id="studentName" type="text" placeholder="Your full name" oninput="render()"></div>
      <div><span>Roll / Sec:</span><input id="studentRoll" type="text" placeholder="e.g. 45/A" oninput="render()"></div>
    </section>

    <section class="tab-bar no-print">
      <button id="tabCode" class="tab-btn active" type="button" onclick="switchTab('code')">Theory + Code</button>
      <button id="tabOutput" class="tab-btn" type="button" onclick="switchTab('output')">Output</button>
      <div id="outControls" class="out-ctrl">
        <label class="toggle"><input id="themeIn" type="checkbox" checked onchange="render()"><span class="switch"></span><span>Dark</span></label>
        <button class="btn-pdf" type="button" onclick="generatePDF()">Print outputs (A4)</button>
      </div>
    </section>

    <div id="content"></div>
    <footer class="no-print">{{SUBJECT}} &middot; copy the code by hand, print only the outputs</footer>
  </div>

<!-- ===================================================================
     Same item shape as templates/printable.html - the data is portable
     between the two templates. Only "output" is ever printed here.
     ==================================================================== -->
<script type="application/json" id="report-meta">
{ "subject": "{{SUBJECT}}", "folder": "{{FOLDER}}", "ext": "c" }
</script>
<script type="application/json" id="report-data">
[
  {
    "no": "1",
    "title": "Sample Program",
    "question": "1. WAP to ... (question text exactly as printed on the question paper).",
    "theory": ["Two or three sentences. What the technique is and the one property that matters."],
    "algorithm": ["Read the input.", "Do the single thing the question asks.", "Print the result."],
    "filename": "program1.c",
    "code": "#include <stdio.h>\n\nint main() {\n    printf(\"Result: 42\\n\");\n\n    printf(\"\\nName: %s  Roll: %s\\n\", \"{NAME}\", \"{ROLL}\");\n    return 0;\n}\n",
    "output": "Result: 42\n\nName: {NAME}  Roll: {ROLL}"
  }
]
</script>

<script>
  const META = JSON.parse(document.getElementById("report-meta").textContent);
  const ITEMS = JSON.parse(document.getElementById("report-data").textContent);
  let tab = "code";
  const expanded = new Set();

  const esc = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const nm = () => document.getElementById("studentName").value.trim() || "[YOUR NAME]";
  const rl = () => document.getElementById("studentRoll").value.trim() || "[YOUR ROLL]";
  const dark = () => document.getElementById("themeIn").checked;
  const pathName = () => (nm().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "student");
  const fill = t => String(t || "").split("{NAME}").join(nm()).split("{ROLL}").join(rl());
  const exeName = f => (String(f || "program").replace(/\.[^/.\\]+$/, "") || "program") + ".exe";

  function execTime(seed) {
    let hash = 0;
    for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
    const a = Math.abs(hash);
    return (((5.0 + (a % 145)) / 1000.0) + (a % 100) / 10000.0).toFixed(4);
  }

  function switchTab(next) {
    tab = next;
    document.getElementById("tabCode").classList.toggle("active", next === "code");
    document.getElementById("tabOutput").classList.toggle("active", next === "output");
    document.getElementById("outControls").classList.toggle("visible", next === "output");
    render();
  }

  function toggleCard(no) {
    if (expanded.has(no)) expanded.delete(no); else expanded.add(no);
    render();
  }

  function copyCode(no) {
    const item = ITEMS.find(i => String(i.no) === String(no));
    if (item) navigator.clipboard.writeText(fill(item.code));
  }

  const theoryHtml = item => (!item.theory || !item.theory.length) ? "" :
    `<div class="info"><div class="info-label">Theory</div>${item.theory.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;

  const algoHtml = item => (!item.algorithm || !item.algorithm.length) ? "" :
    `<div class="info"><div class="info-label">Algorithm</div><ol>${item.algorithm.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`;

  function codeCard(item) {
    const open = expanded.has(String(item.no));
    return `<article class="card${open ? " open" : ""}">
      <div class="card-head" onclick="toggleCard('${esc(item.no)}')">
        <div class="card-num">${esc(item.no)}</div>
        <div class="card-q">${esc(item.question)}</div>
        <div class="arrow">&#9660;</div>
      </div>
      <div class="card-body">
        ${theoryHtml(item)}${algoHtml(item)}
        <div class="code-wrap">
          <div class="code-bar"><span>${esc(item.filename || "program." + META.ext)}</span>
            <button class="btn-copy" type="button" onclick="event.stopPropagation();copyCode('${esc(item.no)}')">Copy</button></div>
          <pre><code>${esc(fill(item.code))}</code></pre>
        </div>
      </div>
    </article>`;
  }

  function terminalHtml(item, theme) {
    const out = fill(item.output);
    return `<div class="win-terminal ${theme}">
      <div class="win-titlebar">
        <div class="win-title-text">C:\\${pathName()}\\${META.folder}\\${exeName(item.filename)}</div>
        <div class="win-btns">
          <div class="win-btn"><svg viewBox="0 0 10 1" fill="currentColor"><rect width="10" height="1"/></svg></div>
          <div class="win-btn"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg></div>
          <div class="win-btn"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg></div>
        </div>
      </div>
      <div class="t-body">${esc(out)}

<span class="t-process">Process exited after ${execTime(String(item.filename || item.no))} seconds with return value 0</span>
<span class="t-press">Press any key to continue . . .</span></div>
    </div>`;
  }

  function render() {
    document.getElementById("progCount").textContent = ITEMS.length + " Programs";
    const area = document.getElementById("content");
    if (tab === "code") {
      area.innerHTML = `<div class="cards">${ITEMS.map(codeCard).join("")}</div>`;
    } else {
      const theme = dark() ? "dark" : "light";
      area.innerHTML = `<div class="terminals">${ITEMS.map(i => terminalHtml(i, theme)).join("")}</div>`;
    }
  }

  const mmToPx = mm => (mm * 96) / 25.4;

  // Measures every terminal, then packs them biggest-first into two columns per A4 page.
  function generatePDF() {
    const isDark = dark();
    const c = isDark
      ? { barBg:"#1f1f1f", barText:"#999", barLine:"#333", bg:"#0c0c0c", fg:"#cccccc", proc:"#e5c07b", press:"#555", btn:"#999", border:"" }
      : { barBg:"#f3f3f3", barText:"#555", barLine:"#e0e0e0", bg:"#ffffff", fg:"#1e1e1e", proc:"#b5850f", press:"#888", btn:"#666", border:"border:1px solid #d4d4d4;" };
    const mono = "'Cascadia Code','Consolas','Courier New',monospace";

    const measure = document.createElement("div");
    measure.style.cssText = `position:fixed;left:-99999px;top:0;width:${mmToPx(210)}px;visibility:hidden;`;
    document.body.appendChild(measure);

    const pad = mmToPx(6), gap = mmToPx(6);
    const pageW = mmToPx(210), pageH = mmToPx(297);
    const colW = (pageW - 2 * pad - gap) / 2;
    const maxColH = pageH - 2 * pad;

    const items = ITEMS.map(item => {
      const block = document.createElement("div");
      block.style.cssText = `border-radius:6px;overflow:hidden;width:${colW}px;${c.border}`;
      block.innerHTML =
        `<div style="display:flex;align-items:center;height:24px;background:${c.barBg};border-bottom:1px solid ${c.barLine};">
           <div style="flex:1;font-family:'Segoe UI',sans-serif;font-size:9px;color:${c.barText};padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
           <div style="display:flex;height:100%;">
             <div style="width:32px;height:24px;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 10 1" fill="${c.btn}" style="width:8px;height:8px;"><rect width="10" height="1"/></svg></div>
             <div style="width:32px;height:24px;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 10 10" fill="none" stroke="${c.btn}" stroke-width="1" style="width:8px;height:8px;"><rect x="0.5" y="0.5" width="9" height="9"/></svg></div>
             <div style="width:32px;height:24px;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 10 10" fill="none" stroke="${c.btn}" stroke-width="1.2" style="width:8px;height:8px;"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg></div>
           </div>
         </div>
         <div style="background:${c.bg};color:${c.fg};font-family:${mono};font-size:10px;line-height:1.4;padding:10px 12px;white-space:pre-wrap;word-wrap:break-word;"></div>`;
      block.children[0].children[0].textContent = `C:\\${pathName()}\\${META.folder}\\${exeName(item.filename)}`;
      const body = block.children[1];
      body.appendChild(document.createTextNode(fill(item.output) + "\n\n"));
      const proc = document.createElement("span");
      proc.style.color = c.proc;
      proc.textContent = `Process exited after ${execTime(String(item.filename || item.no))} seconds with return value 0`;
      body.appendChild(proc);
      const press = document.createElement("span");
      press.style.color = c.press;
      press.textContent = "\nPress any key to continue . . .";
      body.appendChild(press);

      measure.appendChild(block);
      const h = block.offsetHeight;
      measure.removeChild(block);
      return { block, h };
    }).sort((a, b) => b.h - a.h);

    const root = document.createElement("div");
    let page, yLeft = 0, yRight = 0;
    const newPage = () => {
      const pg = document.createElement("div");
      pg.style.cssText = "width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;page-break-after:always;";
      root.appendChild(pg);
      return pg;
    };
    const place = (item, col) => {
      item.block.style.position = "absolute";
      item.block.style.left = (pad + (col === 0 ? 0 : colW + gap)) + "px";
      item.block.style.top = (pad + (col === 0 ? yLeft : yRight)) + "px";
      item.block.style.width = colW + "px";
      page.appendChild(item.block);
      if (col === 0) yLeft += item.h + 8; else yRight += item.h + 8;
    };

    page = newPage();
    items.forEach(item => {
      if (yLeft + item.h > maxColH && yRight + item.h > maxColH) { page = newPage(); yLeft = 0; yRight = 0; }
      const canLeft = yLeft + item.h <= maxColH, canRight = yRight + item.h <= maxColH;
      if (canLeft && canRight) place(item, (maxColH - yLeft - item.h) <= (maxColH - yRight - item.h) ? 0 : 1);
      else place(item, canRight && !canLeft ? 1 : 0);
    });
    if (root.lastChild) root.lastChild.style.pageBreakAfter = "auto";
    document.body.removeChild(measure);

    const iframe = document.createElement("iframe");
    iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:none;";
    document.body.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${META.subject} Output - ${nm()}</title>
      <style>*{box-sizing:border-box;margin:0;padding:0}body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}@page{size:A4;margin:0;}</style>
      </head><body></body></html>`);
    doc.close();
    while (root.firstChild) doc.body.appendChild(doc.adoptNode(root.firstChild));
    setTimeout(() => {
      iframe.contentWindow.print();
      setTimeout(() => document.body.removeChild(iframe), 1000);
    }, 500);
  }

  render();
</script>
</body>
</html>
