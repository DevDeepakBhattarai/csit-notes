<script>
const ITEMS=JSON.parse(document.getElementById('report-data').textContent);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function val(id,fallback){const v=document.getElementById(id).value.trim();return v||fallback}
function student(){return{name:val('nameIn','____________________________'),roll:val('rollIn','____________'),section:val('sectionIn','______'),to:val('toIn','____________________________'),date:val('dateIn','____/____/____'),college:val('collegeIn','____________________________')}}
function slug(s){return String(s||'student').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'student'}
function fill(t,s){const map={'{NAME}':s.name,'{ROLL}':s.roll,'{SECTION}':s.section,'{USER}':slug(s.name)};let v=String(t??'');Object.entries(map).forEach(([k,x])=>v=v.split(k).join(x));return v}
function block(html,cls=''){const d=document.createElement('div');d.className='content-block '+cls;d.innerHTML=html;return d}
function createPage(container){const p=document.createElement('section');p.className='report-page';p.innerHTML='<div class="page-inner"><div class="page-content"></div></div>';container.appendChild(p);return p.querySelector('.page-content')}
function paginate(container,blocks){let c=createPage(container);for(const b of blocks){c.appendChild(b);if(c.scrollHeight>c.clientHeight+2){c.removeChild(b);c=createPage(container);c.appendChild(b)}}}
function fixedPage(container,html){const c=createPage(container);c.innerHTML=html}
function coverHtml(s){return `<div class="cover"><div class="subject">Subject: Operating System</div><h1>LAB REPORT</h1><div class="subtitle">OS Lab Works - Part 2</div><table class="cover-table"><tr><td>Submitted by</td><td><span class="blank">${esc(s.name)}</span></td></tr><tr><td>Roll No.</td><td><span class="blank">${esc(s.roll)}</span></td></tr><tr><td>Section</td><td><span class="blank">${esc(s.section)}</span></td></tr><tr><td>Submitted to</td><td><span class="blank">${esc(s.to)}</span></td></tr><tr><td>College / Campus</td><td><span class="blank">${esc(s.college)}</span></td></tr><tr><td>Submission date</td><td><span class="blank">${esc(s.date)}</span></td></tr></table></div>`}
function indexHtml(){return `<h2 class="index-title">Contents Page</h2><div class="index-sub">Subject: Operating System<br>List of Lab Works</div><table class="index-table"><thead><tr><th>Lab No.</th><th>Title</th><th>Date</th><th>Signature/Remarks</th></tr></thead><tbody><tr><td>1</td><td>Learning basic Linux commands</td><td></td><td></td></tr><tr><td>2</td><td>Process Creation and Termination</td><td></td><td></td></tr><tr><td>3</td><td>Thread Creation and Termination</td><td></td><td></td></tr><tr><td>4</td><td>Simulation of IPC Techniques</td><td></td><td></td></tr></tbody></table>`}
function commandTranscript(item,s){const user=slug(s.name);let lines=[];for(const x of item.commands){lines.push(`<span class="prompt">${esc(user)}@os-lab:~/`+esc(user)+`/OSLab$</span> ${esc(fill(x.command,s))}`);if(x.result) lines.push(esc(fill(x.result,s)));}return lines.join('\n')}
function commandBlock(item,s){const commandRows=item.commands.map(x=>`<li><code>${esc(fill(x.command,s))}</code> - ${esc(x.effect)}</li>`).join('');return block(`<div class="command-card"><h3>${esc(item.no)}. Command Name: ${esc(item.question)}</h3><div class="cmd-grid"><div class="cmd-label">Usage:</div><div>${esc(item.usage)}</div><div class="cmd-label">Syntax:</div><div><code>${esc(item.syntax)}</code></div></div><div class="commands-used"><b>Commands Used and Effect:</b><ol>${commandRows}</ol></div><div class="terminal-wrap"><div class="terminal-label">Output:</div><div class="terminal"><div class="term-title">${esc(slug(s.name))}@os-lab: /home/${esc(slug(s.name))}/OSLab</div><pre class="term-body">${commandTranscript(item,s)}</pre></div></div></div>`)}
function programBlocks(item,s){const blocks=[];blocks.push(block(`<p class="program-question">${esc(item.question)}</p>`));blocks.push(block(`<div class="section-title">Theory:</div><div class="theory-box">${item.theory.map(p=>`<p style="margin:0">${esc(p)}</p>`).join('')}</div>`));const code=fill(item.code,s).split('\n');code.forEach((line,i)=>blocks.push(block(`${i===0?'<div class="section-title">Code:</div>':''}<pre class="plain-code">${line===''?'&nbsp;':esc(line)}</pre>`,'code-line')));if(item.output){const user=slug(s.name);blocks.push(block(`<div class="program-output"><div class="section-title">Output:</div><div class="terminal"><div class="term-title">/home/${esc(user)}/OSLab/${esc(item.filename.replace(/\.c$/,''))}</div><pre class="term-body"><span class="prompt">${esc(user)}@os-lab:~/`+esc(user)+`/OSLab$</span> ./${esc(item.filename.replace(/\.c$/,''))}\n${esc(fill(item.output,s))}</pre></div></div>`))}return blocks}
function render(){const s=student(),container=document.getElementById('pages');container.innerHTML='';fixedPage(container,coverHtml(s));fixedPage(container,indexHtml());const commands=ITEMS.filter(x=>x.kind==='command');const cmdBlocks=[block('<div class="lab-heading">Lab 1: Learning basic Linux commands</div>')];commands.forEach(x=>cmdBlocks.push(commandBlock(x,s)));paginate(container,cmdBlocks);const groups=[['2'],['3'],['4(a)','4(b)','4(c)','4(d)']];for(const group of groups){const title=group[0]==='2'?'Lab 2: Process Creation and Termination':group[0]==='3'?'Lab 3: Thread Creation and Termination':'Lab 4: Simulation of IPC Techniques';const blocks=[block(`<div class="lab-heading">${title}</div>`)];for(const no of group){const item=ITEMS.find(x=>x.no===no);blocks.push(...programBlocks(item,s));}paginate(container,blocks)}}
['nameIn','rollIn','sectionIn','toIn','dateIn','collegeIn'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();
</script>
