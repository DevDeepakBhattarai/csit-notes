<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computer Network Lab Report - Index</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  :root {
    --paper-width: 210mm;
    --paper-height: 297mm;
    --paper-padding: 10mm;
    --page-border-padding: 5.5mm;
    --screen-bg: #101217;
    --panel: #181c24;
    --line: rgba(255,255,255,.12);
    --text: #eef2f6;
    --muted: #9aa6b5;
    --green: #2bb673;
  }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--screen-bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, sans-serif;
  }

  .controls {
    max-width: 1120px;
    margin: 22px auto 8px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(24,28,36,.96);
  }
  .controls-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 18px;
  }
  .controls h1 { margin: 0; color: #fff; font-size: 22px; line-height: 1.2; }
  .controls p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .right-controls { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .field label {
    display: block;
    margin: 0 0 5px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .field input {
    height: 36px;
    width: 132px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 6px;
    background: #202633;
    color: var(--text);
    padding: 0 10px;
    font-size: 13px;
    outline: none;
  }
  .print-btn {
    height: 36px;
    border: 0;
    border-radius: 6px;
    background: var(--green);
    color: #fff;
    padding: 0 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .stats {
    margin-top: 12px;
    padding-top: 11px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }
  .stats strong { color: #fff; }

  .pages { padding: 8px 0 36px; overflow-x: auto; }
  .report-page {
    width: var(--paper-width);
    height: var(--paper-height);
    margin: 24px auto;
    padding: var(--paper-padding);
    color: #121212;
    background: #fff;
    box-shadow: 0 18px 50px rgba(0,0,0,.36);
    font-family: "Times New Roman", Times, serif;
    overflow: hidden;
  }
  .page-inner {
    height: 100%;
    border: 2px solid #202020;
    padding: var(--page-border-padding);
    overflow: hidden;
    background: #fff;
  }
  .page-content { width: 100%; height: 100%; overflow: hidden; }

  .index-title {
    margin: 0 0 2.2mm;
    text-align: center;
    font-size: 17pt;
    line-height: 1.2;
    font-weight: 700;
  }
  .index-subtitle {
    margin: 0 0 3mm;
    text-align: center;
    font-size: 11.5pt;
    line-height: 1.2;
    font-weight: 700;
  }
  .index-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10.8pt;
    line-height: 1.18;
    table-layout: fixed;
  }
  .index-table th,
  .index-table td {
    border: 1px solid #cfd4dc;
    padding: 1.15mm 1.8mm;
    vertical-align: middle;
  }
  .index-table th {
    background: #f0f3f7;
    text-align: left;
    font-weight: 700;
  }
  .index-table th:nth-child(1), .index-table td:nth-child(1) {
    width: 13mm;
    text-align: center;
    font-weight: 700;
    white-space: nowrap;
  }
  .index-table th:nth-child(3), .index-table td:nth-child(3) {
    width: 29mm;
    text-align: center;
  }
  .index-table th:nth-child(4), .index-table td:nth-child(4) {
    width: 31mm;
    text-align: center;
  }
  .index-table tbody tr { break-inside: avoid; page-break-inside: avoid; }
  .question-cell { overflow-wrap: anywhere; }
  .signature-cell { height: 7mm; }

  @media (max-width: 900px) {
    .controls { margin: 12px; }
    .controls-head { display: block; }
    .right-controls { margin-top: 12px; }
    .report-page { margin: 12px 0; }
  }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { margin: 0; padding: 0; background: #fff; }
    .no-print { display: none !important; }
    .pages { padding: 0; overflow: visible; }
    .report-page {
      width: var(--paper-width);
      height: var(--paper-height);
      margin: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .report-page:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<section class="controls no-print">
  <div class="controls-head">
    <div>
      <h1>Computer Network Lab Report - Index</h1>
      <p>Complete index for all Computer Network lab questions. Print on A4 with margins None and background graphics ON.</p>
    </div>
    <div class="right-controls">
      <div class="field">
        <label for="dateIn">Submitted Date</label>
        <input id="dateIn" value="2083/05/__" oninput="render()">
      </div>
      <button class="print-btn" type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>
  <div class="stats"><strong id="questionCount">0</strong> questions &nbsp;&middot;&nbsp; <strong id="pageCount">0</strong> A4 index pages</div>
</section>

<main id="pages" class="pages"></main>

<script type="application/json" id="question-data">[{"id":"1","question":"Connect two computer using straight cable in packet tracer. Verify the connection using Ping Command.(Show all the steps)"},{"id":"2","question":"Connect two computer using cross cable in packet tracer. Verify the connection using Ping Command.(Show all the steps)"},{"id":"3","question":"Implementation of Bus Topology."},{"id":"4","question":"Implementation of Star Topology"},{"id":"5","question":"Implementation of Ring Topology."},{"id":"6","question":"Implementation of Tree Topology."},{"id":"7","question":"Implementation of Mesh Topology."},{"id":"8","question":"lmplementation of Bus and Star Topology."},{"id":"9","question":"Implementation of RIP Routing in Cisco for Connecting Two Routers"},{"id":"10","question":"Simulate the BGP routing protocol in packet tracer"},{"id":"11","question":"Simulate the ospf routing protocol in packet tracer"},{"id":"12","question":"Implement Static Routing"},{"id":"14","question":"C:\\>ping: Tests connectivity between your computer and another device on the network by sending packets and awaiting a response."},{"id":"15","question":"C:\\>ipconfig: Displays the current TCP/IP configuration of the computer, such as IP address, subnet mask, and default gateway."},{"id":"16","question":"C:\\>ipconfig /all: Provides detailed information on the computer's network configuration, including DNS, DHCP, and Ethernet adapter details."},{"id":"17","question":"C:\\>ipconfig /release: Releases the current IP address obtained from the DHCP server."},{"id":"18","question":"C:\\>ipconfig /renew: Renews the IP address lease from the DHCP server."},{"id":"19","question":"C:\\>ipconfig /flushdns: Clears the DNS resolver cache, useful when dealing with DNS issues."},{"id":"20","question":"C:\\>nbtstat -a: Displays the NetBIOS name table of a remote computer."},{"id":"21","question":"C:\\>arp -a: Shows the IP address and MAC address mappings on the network."},{"id":"22","question":"C:\\>hostname: Displays the name of your computer."},{"id":"23","question":"C:\\>netdiag: Diagnoses network issues (needs to be installed from Windows support tools)."},{"id":"24","question":"C:\\>netstat: Displays current active TCP/IP connections and listening ports."},{"id":"25","question":"C:\\>nslookup: Diagnoses DNS problems by querying DNS servers for domain name information."},{"id":"26","question":"C:\\>pathping: A combination of ping and tracert, traces the path and measures packet loss."},{"id":"27","question":"C:\\>route: Displays and modifies the routing table on the computer."},{"id":"28","question":"C:\\>tracert: Displays the path packets take to reach a destination, useful for troubleshooting network routing issues."}]</script>
<script>
const QUESTIONS = JSON.parse(document.getElementById('question-data').textContent);

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function createPage(container, pageNumber) {
  const page = document.createElement('section');
  page.className = 'report-page';
  page.dataset.page = String(pageNumber);
  page.innerHTML = `<div class="page-inner"><div class="page-content">
    ${pageNumber === 1 ? `<h2 class="index-title">Index</h2>\n    <div class="index-subtitle">Computer Network Lab Report</div>` : ''}
    <table class="index-table">
      <thead><tr>
        <th>SN</th>
        <th>Experiment / Question</th>
        <th>Submitted Date</th>
        <th>Signature</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div></div>`;
  container.appendChild(page);
  return {
    content: page.querySelector('.page-content'),
    tbody: page.querySelector('tbody')
  };
}

function makeRow(item, date, serial) {
  const row = document.createElement('tr');
  row.dataset.questionId = item.id;
  row.innerHTML = `
    <td>${serial}</td>
    <td class="question-cell">${esc(item.question)}</td>
    <td>${esc(date)}</td>
    <td class="signature-cell"></td>`;
  return row;
}

function render() {
  const container = document.getElementById('pages');
  const date = document.getElementById('dateIn').value.trim() || '2083/05/__';
  container.innerHTML = '';

  let pageNumber = 1;
  let page = createPage(container, pageNumber);
  let serial = 1;

  for (const item of QUESTIONS) {
    const row = makeRow(item, date, serial);
    page.tbody.appendChild(row);

    if (page.content.scrollHeight > page.content.clientHeight + 2) {
      page.tbody.removeChild(row);
      pageNumber += 1;
      page = createPage(container, pageNumber);
      page.tbody.appendChild(row);
    }
    serial += 1;
  }

  document.getElementById('questionCount').textContent = String(QUESTIONS.length);
  document.getElementById('pageCount').textContent = String(pageNumber);
}

document.getElementById('dateIn').addEventListener('change', render);
render();
</script>
</body>
</html>
