<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBMS Lab Report Part 2 - Printable</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  :root {
    --paper-w: 210mm;
    --paper-h: 297mm;
    --paper-padding: 10mm;
    --page-border-padding: 5.5mm;
  }
  html,body { margin:0; padding:0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background:#17191d;
    color:#111;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:flex-start;
    flex-wrap:wrap;
    padding:14px 18px;
    background:rgba(23,25,29,.96);
    border-bottom:1px solid rgba(255,255,255,.10);
    color:#fff;
    backdrop-filter: blur(10px);
  }
  .toolbar .field { display:flex; flex-direction:column; gap:5px; }
  .toolbar label {
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#9ba3af;
  }
  .toolbar select {
    height:36px;
    min-width:110px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:6px;
    background:#242830;
    color:#fff;
    padding:0 10px;
    font-size:13px;
  }
  .labs {
    display:flex;
    align-items:center;
    gap:10px;
    height:36px;
    padding:0 10px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:6px;
    background:#242830;
  }
  .labs label {
    display:flex;
    align-items:center;
    gap:5px;
    color:#e6e8ec;
    font-size:12px;
    font-weight:600;
    letter-spacing:0;
    text-transform:none;
    cursor:pointer;
  }
  .labs input { accent-color:#fff; }
  .stats {
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stat {
    display:flex;
    align-items:baseline;
    gap:7px;
    min-height:36px;
    padding:8px 11px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:6px;
    background:#242830;
  }
  .stat-label {
    color:#9ba3af;
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .stat-value {
    color:#fff;
    font-size:14px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .print-btn {
    margin-left:auto;
    height:36px;
    border:0;
    border-radius:6px;
    background:#fff;
    color:#111;
    padding:0 16px;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
  }
  .count { color:#9ba3af; font-size:12px; margin-left:auto; padding-bottom:9px; }

  .pages {
    padding:26px 0 48px;
    overflow-x:auto;
  }
  .paper {
    width:var(--paper-w);
    height:var(--paper-h);
    margin:0 auto 26px;
    padding:var(--paper-padding);
    background:#fff;
    box-shadow:0 18px 48px rgba(0,0,0,.38);
    overflow:hidden;
  }
  .page-inner {
    width:100%;
    height:100%;
    border:2px solid #202020;
    padding:var(--page-border-padding);
    overflow:hidden;
    background:#fff;
  }
  .page-content {
    width:100%;
    height:100%;
    overflow:hidden;
  }

  .pair {
    width:100%;
    margin:0 0 7mm;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .write-space {
    width:100%;
    background:#fff;
  }

  .xampp {
    width:100%;
    background:#fff;
    color:#000;
    border:1px solid #a6a6a6;
    overflow:hidden;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .notice {
    padding:2mm 2.4mm;
    background:#e0e0e0;
    border-bottom:1px solid #b8b8b8;
    font:600 8.2pt/1.25 Arial,Helvetica,sans-serif;
  }
  .query {
    padding:2mm 2.5mm;
    background:#f2f2f2;
    color:#000;
    border-bottom:1px solid #c4c4c4;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font:7.6pt/1.32 Arial,Helvetica,sans-serif;
  }
  .query .kw { color:#000; text-decoration:underline dotted; font-weight:700; }
  .query .str,.query .com { color:#000; }
  .profile {
    display:flex;
    gap:2.2mm;
    flex-wrap:wrap;
    padding:1.4mm 2.4mm;
    background:#eeeeee;
    border-bottom:1px solid #c8c8c8;
    font:7.2pt/1.2 Arial,Helvetica,sans-serif;
  }
  .result { overflow:visible; padding:1.4mm 0 1.8mm; }
  .extra {
    margin:0 0 1.4mm 2mm;
    padding:.8mm 1.8mm;
    border:1px solid #555;
    border-radius:3px;
    background:linear-gradient(#fff,#d7d7d7);
    color:#111;
    font:7pt/1.1 Arial,Helvetica,sans-serif;
  }
  .pm-table {
    border-collapse:collapse;
    width:max-content;
    min-width:36mm;
    max-width:100%;
    color:#000;
    background:#fff;
    font:8pt/1.2 Arial,Helvetica,sans-serif;
  }
  .pm-table th,.pm-table td {
    padding:1.2mm 1.7mm;
    text-align:left;
    vertical-align:top;
    white-space:nowrap;
  }
  .pm-table th { background:#d7d7d7; font-weight:700; }
  .pm-table tr:nth-child(even) td { background:#ededed; }
  .pm-table.wide-table {
    width:100%; min-width:0; table-layout:fixed;
    font-size:6.25pt; line-height:1.10;
  }
  .pm-table.wide-table th,.pm-table.wide-table td {
    padding:.65mm .72mm;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:normal;
  }
  .empty { padding:3mm; font:italic 8pt/1.2 Arial,Helvetica,sans-serif; }
  .null { font-style:italic; }

  @media (max-width: 850px) {
    .paper { margin-left:12px; margin-right:12px; }
    .count { width:100%; margin-left:0; padding-bottom:0; }
  }

  @media print {
    body { background:#fff; }
    .toolbar { display:none !important; }
    .pages { padding:0; overflow:visible; }
    .paper {
      width:210mm;
      height:297mm;
      margin:0;
      padding:10mm;
      box-shadow:none;
      page-break-after:always;
      break-after:page;
    }
    .page-inner {
      width:100%;
      height:100%;
      border:2px solid #202020;
      padding:5.5mm;
    }
    .page-content {
      width:100%;
      height:100%;
      margin:0;
    }
    .paper:last-child { page-break-after:auto; break-after:auto; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }
</style>
</head>

function esc(v) {
  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function highlight(sql) {
  let s = esc(sql);
  s = s.replace(/(--.*)$/gm,'<span class="com">$1</span>');
  s = s.replace(/'([^']*)'/g,"<span class='str'>'$1'</span>");
  return s.replace(/\b(SELECT|FROM|WHERE|ORDER|BY|GROUP|HAVING|AS|IN|NOT|AND|OR|LIKE|IS|NULL|DISTINCT|COUNT|AVG|MONTH|INSERT|INTO|VALUES|UPDATE|SET|CASE|WHEN|THEN|ELSE|END|DELETE|JOIN|ON|CREATE|VIEW|DROP|IF|EXISTS|UNION|ALL|CONCAT)\b/gi,'<span class="kw">$1</span>');
}

function effective(item) {
  const x = {...item};
  x.sql = x.sql.replaceAll('{{FIRST_LETTER}}', FIRST_LETTER);
  if (item.dynamic === 'customer_city_initial') {
    x.columns = ['CustomerID','CustomerName','ContactName','Address','City','PostalCode','Country'];
    x.rows = CUSTOMER_DATA.filter(r => String(r[4]).toUpperCase().startsWith(FIRST_LETTER));
  }
  if (item.dynamic === 'product_name_initial') {
    x.columns = ['ProductID','ProductName','SupplierID','CategoryID','Unit','Price'];
    x.rows = PRODUCT_DATA.filter(r => String(r[1]).toUpperCase().startsWith(FIRST_LETTER));
  }
  return x;
}

function handwritingHeight(sql) {
  const text = String(sql || '');
  const lines = text.split('\n').length;
  const chars = text.length;
  let base;
  if (lines >= 15 || chars >= 700) base = 88;
  else if (lines >= 9 || chars >= 420) base = 72;
  else if (lines >= 5 || chars >= 240) base = 58;
  else if (chars >= 140) base = 48;
  else base = 38;
  return base * 1.07;
}

function table(columns, rows) {
  if (!rows || !rows.length) {
    return '<div class="empty">MySQL returned an empty result set (zero rows).</div>';
  }
  const cls = columns.length > 6 ? 'pm-table wide-table' : 'pm-table';
  return `<table class="${cls}"><thead><tr>${columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => `<td>${v === null ? '<span class="null">NULL</span>' : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function output(item) {
  const x = effective(item);
  const count = x.rows?.length ?? 0;
  const affected = x.affected ? ` · ${x.affected} row(s) affected before verification` : '';
  const shownSql = x.verify ? `${x.sql}\n\n-- Verification query\n${x.verify}` : x.sql;
  return `<div class="xampp">
    <div class="notice">Your SQL query has been executed successfully. ${count} row(s) returned${affected}.</div>
    <div class="query">${highlight(shownSql)}</div>
    <div class="profile"><span>&#9633; Profiling</span><span>[ Edit inline ]</span><span>[ Edit ]</span><span>[ Create PHP code ]</span><span>[ Refresh ]</span></div>
    <div class="result"><button class="extra">Extra options</button>${table(x.columns || [], x.rows || [])}</div>
  </div>`;
}

function makePair(item) {
  const x = effective(item);
  const pair = document.createElement('section');
  pair.className = 'pair';
  pair.innerHTML = `<div class="write-space" style="height:${handwritingHeight(x.sql)}mm"></div>${output(x)}`;
  return pair;
}

function createPage(container) {
  const page = document.createElement('section');
  page.className = 'paper';
  page.innerHTML = '<div class="page-inner"><div class="page-content"></div></div>';
  container.appendChild(page);
  return page.querySelector('.page-content');
}

function selectedItems() {
  return ITEMS;
}

function render() {
  const items = selectedItems();
  const container = document.getElementById('pages');
  container.innerHTML = '';
  let content = createPage(container);
  let currentLab = null;

  for (const item of items) {
    if (currentLab !== null && item.lab !== currentLab) {
      content = createPage(container);
    }
    currentLab = item.lab;

    const pair = makePair(item);
    content.appendChild(pair);
    if (content.scrollHeight > content.clientHeight + 2) {
      content.removeChild(pair);
      content = createPage(container);
      content.appendChild(pair);
    }
  }

  if (!items.length) container.innerHTML = '';
  document.getElementById('questionCount').textContent = String(items.length);
  document.getElementById('pageCount').textContent = String(container.querySelectorAll('.paper').length);
}

render();
