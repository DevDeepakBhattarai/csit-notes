  <style>
    :root{--bg:#090d12;--surface:#0f151e;--surface-2:#131b26;--card:#101720;--border:rgba(255,255,255,.085);--muted:#7f8b9c;--text:#edf2f7;--blue:#4b8df8;--cyan:#42d4ed;--paper:#fff;--ink:#263241}
    *{box-sizing:border-box;margin:0;padding:0}

    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI",Calibri,sans-serif}

    .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:9px}
    .mode-tabs{display:flex;gap:6px;margin-right:auto}
    .action{height:32px;border:1px solid var(--border);background:#0d131b;color:#aeb8c7;border-radius:6px;padding:0 10px;font:650 11px "Segoe UI",sans-serif;cursor:pointer}
    .action:hover{color:#fff;background:#141c27;border-color:rgba(255,255,255,.13)}
    .action.primary{background:#3478e5;border-color:#3478e5;color:#fff}
    .list{display:flex;flex-direction:column;gap:7px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .card-head{min-height:44px;display:flex;align-items:center;gap:10px;padding:7px 11px;cursor:pointer;background:#111923}
    .card-head:hover{background:#141d28}
    .num{min-width:58px;height:28px;padding:0 8px;display:grid;place-items:center;border:1px solid rgba(66,212,237,.23);background:rgba(66,212,237,.06);color:var(--cyan);border-radius:6px;font:800 12px Consolas,monospace;flex:0 0 auto}
    .title{min-width:0;flex:1}
    .title h2{font-size:14px;color:#fff}
    .title p{font-size:13px;font-weight:600;color:#d7deea;line-height:1.35;margin:0}
    .arrow{width:8px;height:8px;margin:0 4px 3px 8px;border-right:2px solid #657286;border-bottom:2px solid #657286;transform:rotate(45deg);transition:transform .16s ease;flex:0 0 auto}
    .body{display:none;padding:0 11px 10px}
    .card.open .body{display:flex;flex-direction:column;gap:8px}
    .card.open .arrow{transform:rotate(225deg);margin-bottom:-3px}
    .setup-card:not(.open){display:none}
    .code{border:1px solid rgba(255,255,255,.075);border-radius:6px;overflow:hidden;background:#0a0f16}
    .codebar{min-height:28px;display:flex;justify-content:space-between;align-items:center;background:#121923;padding:5px 9px;color:#7f8ba0;font:700 10px Consolas,monospace}
    .copy{border:0;background:none;color:#8f9caf;cursor:pointer;font:700 10px Consolas,monospace;padding:2px 0}
    .copy:hover{color:white}
    pre.sql{padding:10px 11px 11px;overflow:visible;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;color:#dbe4ef;font:12px/1.5 Consolas,monospace}
    .kw{color:#72cdf5;font-weight:700}.str{color:#f4c65d}.com{color:#7f8da0}
    .xampp{background:#fff;color:#111;border:1px solid #777;border-radius:4px;overflow:hidden;box-shadow:none}.xampp .kw,.xampp .str,.xampp .com,.xampp .null,.xampp .pm-link{color:#111!important}.xampp .kw{text-decoration:underline dotted;font-weight:700}
    .notice{background:#d2d2d2;color:#111;border-bottom:1px solid #aaa;padding:8px 10px;font-size:13px;line-height:1.35;font-weight:600}
    .query{background:#ededed;color:#111;border-bottom:1px solid #bbb;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.45 "Segoe UI",sans-serif}
    .profile{display:flex;gap:7px;flex-wrap:wrap;background:#ddd;color:#111;border-bottom:1px solid #bbb;padding:6px 9px;font-size:12px}
    .result{padding:7px 0 10px;overflow:auto;background:#fff}
    .extra{margin:0 0 7px 7px;padding:3px 7px;border:1px solid #777;border-radius:3px;background:#eee;color:#111;font-size:11px}
    .pm-table{border-collapse:collapse;width:max-content;min-width:420px;background:#fff;color:#111;font-size:13px}.pm-table th{background:#e5e5e5;color:#111;padding:5px 7px;text-align:left;white-space:nowrap}.pm-table td{padding:5px 7px;color:#111;white-space:nowrap;vertical-align:top}.pm-table tr:nth-child(even) td{background:#ededed}.pm-table.wide-table{width:100%;min-width:0;font-size:11.5px;table-layout:auto}.pm-table.wide-table th,.pm-table.wide-table td{padding:3px 5px;white-space:normal;overflow-wrap:anywhere;word-break:normal;line-height:1.22}.empty{padding:10px;color:#333;font-size:13px;font-style:italic}.null{color:#111;font-style:italic;font-family:Consolas,monospace}
    .footer{margin-top:16px;border-top:1px solid var(--border);padding-top:10px;text-align:center;color:#677386;font:700 9px Consolas,monospace;letter-spacing:.04em}    @media(max-width:850px){.inputs{grid-template-columns:1fr 1fr}.container{width:calc(100vw - 20px)}.toolbar{justify-content:flex-start}}
    @media(max-width:560px){.inputs{grid-template-columns:1fr}.card-head{align-items:flex-start}.num{width:58px}}

 solid #b8b8b8!important}body[data-mode="output"] .profile{padding:5px 8px!important;background:#e8e8e8!important;color:#000!important;border-bottom:1px solid #c4c4c4!important}body[data-mode="output"] .xampp .kw,body[data-mode="output"] .xampp .str,body[data-mode="output"] .xampp .com,body[data-mode="output"] .xampp .null,body[data-mode="output"] .xampp .pm-link{color:#000!important}body[data-mode="output"] .result{padding:6px 0 8px!important;overflow:visible!important}body[data-mode="output"] .pm-table{min-width:0!important}body[data-mode="output"] .pm-table th,body[data-mode="output"] .pm-table td{padding:3px 5px!important}body[data-mode="output"] .pm-table.wide-table{width:100%!important;font-size:7.5pt!important;table-layout:auto!important}body[data-mode="output"] .pm-table.wide-table th,body[data-mode="output"] .pm-table.wide-table td{padding:2px 3px!important;white-space:normal!important;overflow-wrap:anywhere!important;line-height:1.18!important}}

  [1,'Chai',1,1,'10 boxes x 20 bags','18.00'],[2,'Chang',1,1,'24 - 12 oz bottles','19.00'],[3,'Aniseed Syrup',1,1,'12 - 550 ml bottles','10.00'],[4,'Chef Anton Cajun Seasoning',2,2,'48 - 6 oz jars','22.00'],[5,'Ikura',2,2,'12 - 200 ml jars','31.00'],[6,'Uncle Bob Organic Dried Pears',3,3,'12 - 1 lb pkgs.','30.00']
];
let mode='output';
let setupOpen=false;
let allOpen=true;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function firstLetter(){const s=document.getElementById('name').value.trim();return (s[0]||'D').toUpperCase()}
function effective(item){const x={...item};x.sql=x.sql.replaceAll('{{FIRST_LETTER}}',firstLetter());if(item.dynamic==='customer_city_initial'){x.columns=['CustomerID','CustomerName','ContactName','Address','City','PostalCode','Country'];x.rows=CUSTOMER_DATA.filter(r=>String(r[4]).toUpperCase().startsWith(firstLetter()))}if(item.dynamic==='product_name_initial'){x.columns=['ProductID','ProductName','SupplierID','CategoryID','Unit','Price'];x.rows=PRODUCT_DATA.filter(r=>String(r[1]).toUpperCase().startsWith(firstLetter()))}return x}
function highlight(sql){let s=esc(sql);s=s.replace(/(--.*)$/gm,'<span class="com">$1</span>');s=s.replace(/'([^']*)'/g,"<span class='str'>'$1'</span>");return s.replace(/\b(SELECT|FROM|WHERE|ORDER|BY|GROUP|HAVING|AS|IN|NOT|AND|OR|LIKE|IS|NULL|DISTINCT|COUNT|AVG|MONTH|INSERT|INTO|VALUES|UPDATE|SET|CASE|WHEN|THEN|ELSE|END|DELETE|JOIN|ON|CREATE|VIEW|DROP|IF|EXISTS|UNION|ALL|CONCAT)\b/gi,'<span class="kw">$1</span>')}
function table(columns,rows){if(!rows||!rows.length)return '<div class="empty">MySQL returned an empty result set (zero rows).</div>';const tableClass=columns.length>6?'pm-table wide-table':'pm-table';return `<table class="${tableClass}"><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<span class="null">NULL</span>':esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function outputPane(x){const count=x.rows?.length??0;const affected=x.affected?` Â· ${x.affected} row(s) affected before verification`:'';const shownSql=x.verify?`${x.sql}\n\n-- Verification query\n${x.verify}`:x.sql;return `<section class="xampp"><div class="notice">Your SQL query has been executed successfully. ${count} row(s) returned${affected}.</div><div class="query">${highlight(shownSql)}</div><div class="profile"><span>Profiling</span><span>[ Edit inline ]</span><span>[ Edit ]</span><span>[ Create PHP code ]</span><span>[ Refresh ]</span></div><div class="result"><button class="extra">Extra options</button>${table(x.columns,x.rows)}</div></section>`}
function inputCard(item){const x=effective(item);return `<article class="card ${allOpen?'open':''}"><div class="card-head" onclick="this.parentElement.classList.toggle('open')"><div class="num">${x.id}</div><div class="title"><p>${esc(x.question)}</p></div><div class="arrow"></div></div><div class="body"><div class="code"><div class="codebar"><span>dbms_${x.id.toLowerCase()}.sql</span><button class="copy" onclick="event.stopPropagation();navigator.clipboard.writeText(${JSON.stringify(x.sql)})">Copy SQL</button></div><pre class="sql">${highlight(x.sql)}</pre></div></div></article>`}
function outputCard(item){const x=effective(item);return `<article class="card ${allOpen?'open':''}"><div class="card-head" onclick="this.parentElement.classList.toggle('open')"><div class="num">${x.id}</div><div class="title"><p>${esc(x.question)}</p></div><div class="arrow"></div></div><div class="body">${outputPane(x)}</div></article>`}
function setupCard(){return `<article id="setupCard" class="card setup-card ${setupOpen?'open':''}"><div class="card-head" onclick="toggleSetup()"><div class="num">SETUP</div><div class="title"><h2>Northwind-style Database Setup</h2><p>Create the schema and sample data before running the lab answers.</p></div><div class="arrow"></div></div><div class="body"><div class="code"><div class="codebar"><span>rkgajurelnorthwind_setup.sql</span><button class="copy" onclick="event.stopPropagation();navigator.clipboard.writeText(SETUP_SQL)">Copy SQL</button></div><pre class="sql">${highlight(SETUP_SQL)}</pre></div></div></article>`}
function setMode(next){mode=next;setupOpen=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleSetup(){if(mode!=='input'){mode='input'}setupOpen=!setupOpen;render();if(setupOpen){requestAnimationFrame(()=>document.getElementById('setupCard')?.scrollIntoView({behavior:'smooth',block:'start'}))}}
function toggleAll(){allOpen=!allOpen;render()}
function render(){document.body.dataset.mode=mode;document.getElementById('inputTab').classList.toggle('primary',mode==='input');document.getElementById('outputTab').classList.toggle('primary',mode==='output');const cards=mode==='input'?`${setupCard()}${ITEMS.map(inputCard).join('')}`:ITEMS.map(outputCard).join('');document.getElementById('content').innerHTML=`<div class="list">${cards}</div>`}
function downloadHtml(){const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='DBMS_Lab_Report_Part2_Optimized_Group_B_Output.html';a.click();URL.revokeObjectURL(a.href)}
function printOutput(){window.print()}
render();
